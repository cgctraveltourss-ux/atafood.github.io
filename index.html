<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ata Food</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #e63946;
            color: white;
            padding: 40px 20px;
        }
        h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        p {
            font-size: 1.2rem;
        }
        .container {
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .menu-item {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Ata Food</h1>
        <p>Delicious Meals & Catering Services</p>
    </header>

    <div class="container">
        <h2>Our Special Menu</h2>
        
        <div class="menu-item">
            <h3>Special Dish #1</h3>
            <p>Freshly prepared ingredients served daily.</p>
        </div>

        <div class="menu-item">
            <h3>Special Dish #2</h3>
            <p>High-quality catering options for all events.</p>
        </div>
    </div>

</body>
</html>
